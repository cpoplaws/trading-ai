kind = "video"
previewPath = "/promo-video/"
title = "Quantlytics Promo Video"
description = "A short animated promo video showcasing the Quantlytics AI crypto trading platform. It highlights the AI agent swarm, multi-chain execution across Base, Solana and L2s, market intelligence signals, and live portfolio performance metrics as motion graphics for use on a landing page or social media."
version = "1.0.0"
id = "artifacts/promo-video"
router = "path"

[[services]]
name = "web"
paths = [ "/promo-video/" ]
localPort = 22228

[services.development]
run = "pnpm --filter @workspace/promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/promo-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/promo-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22228"
BASE_PATH = "/promo-video/"
videoAspectRatio = "16:9"
