kind = "slides"
previewPath = "/quantlytics-pitch-deck/"
title = "Quantlytics Pitch Deck"
description = "A dark-themed investor and stakeholder pitch deck for Quantlytics, the AI crypto trading platform. Covers the problem with manual multi-chain trading, the platform overview, the four-agent AI swarm, multi-chain execution across Base/Solana/L2s, live market intelligence, a guided live demo flow, and next steps."
version = "1.0.0"
id = "artifacts/quantlytics-pitch-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/quantlytics-pitch-deck/" ]
localPort = 20800

[services.development]
run = "pnpm --filter @workspace/quantlytics-pitch-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantlytics-pitch-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/quantlytics-pitch-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20800"
BASE_PATH = "/quantlytics-pitch-deck/"
